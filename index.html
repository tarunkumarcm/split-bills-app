<!DOCTYPE html>
<html>
<head>
  <title>Split Bills</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
      background: #0f172a;
      color: #e2e8f0;
      padding: 16px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 10px;
      border-radius: 10px;
      border: none;
      background: #0f172a;
      color: white;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      background: #3b82f6;
      color: white;
      font-size: 15px;
      font-weight: 600;
      margin-top: 5px;
    }

    button:active {
      opacity: 0.8;
    }

    .expense {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .owe {
      color: #f87171;
      font-size: 14px;
    }

    .reset {
      background: #ef4444;
      margin-top: 10px;
    }

    hr {
      border: none;
      border-top: 1px solid #334155;
      margin: 10px 0;
    }
  </style>
</head>

<body>

<div class="container">

<h2>💸 Split Bills</h2>

<div class="card">
  <input id="person" placeholder="Who paid?" />
  <input id="amount" type="number" placeholder="Amount" />
  <input id="desc" placeholder="What was it for?" />
  <button onclick="addExpense()">Add Expense</button>
</div>

<div class="card">
  <h3>Expenses</h3>
  <div id="list"></div>
</div>

<div class="card">
  <h3>Summary</h3>
  <div id="summary"></div>
</div>

<button class="reset" onclick="resetAll()">Reset All</button>

</div>

<script>
let data = JSON.parse(localStorage.getItem("bills")) || [];

function save() {
  localStorage.setItem("bills", JSON.stringify(data));
}

function addExpense() {
  const person = document.getElementById("person").value.trim();
  const amount = parseFloat(document.getElementById("amount").value);
  const desc = document.getElementById("desc").value.trim();

  if (!person || !amount) return;

  data.push({ person, amount, desc });
  save();
  render();

  document.getElementById("person").value = "";
  document.getElementById("amount").value = "";
  document.getElementById("desc").value = "";
}

function resetAll() {
  if (confirm("Clear all data?")) {
    data = [];
    save();
    render();
  }
}

function render() {
  const list = document.getElementById("list");
  const summary = document.getElementById("summary");

  list.innerHTML = "";
  summary.innerHTML = "";

  let totals = {};

  data.forEach(e => {
    list.innerHTML += `<div class="expense"><span>${e.person} - ${e.desc || "Expense"}</span><span>₹${e.amount}</span></div>`;
    totals[e.person] = (totals[e.person] || 0) + e.amount;
  });

  let people = Object.keys(totals);
  let total = Object.values(totals).reduce((a,b)=>a+b,0);
  let per = people.length ? total / people.length : 0;

  people.forEach(p => {
    summary.innerHTML += `<div class="summary-item"><span>${p}</span><span>₹${totals[p].toFixed(2)}</span></div>`;
  });

  summary.innerHTML += `<hr><div>Total: ₹${total.toFixed(2)}</div><div>Per person: ₹${per.toFixed(2)}</div><br>`;

  people.forEach(p => {
    let diff = totals[p] - per;
    if (diff < 0) {
      summary.innerHTML += `<div class="owe">${p} owes ₹${Math.abs(diff).toFixed(2)}</div>`;
    }
  });
}

render();
</script>

</body>
</html>
